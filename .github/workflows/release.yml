name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: proctor-linux-x86_64.tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact_name: proctor-linux-aarch64.tar.gz

          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: proctor-darwin-x86_64.tar.gz

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: proctor-darwin-aarch64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin proctor

      - name: Package release artifact
        shell: bash
        run: |
          mkdir -p dist
          tar -czvf "dist/${{ matrix.artifact_name }}" -C "target/${{ matrix.target }}/release" proctor
          cd dist
          if command -v sha256sum &> /dev/null; then
            sha256sum "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release with Sigstore Provenance
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-merged
          merge-multiple: true

      - name: Display downloaded artifacts
        run: ls -la dist-merged

      - name: Generate Sigstore Artifact Attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist-merged/*.tar.gz'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-merged/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
