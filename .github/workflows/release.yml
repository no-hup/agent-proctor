name: Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: proctor-linux-x86_64.tar.gz
            use_cross: false

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: proctor-linux-aarch64.tar.gz
            use_cross: true

          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: proctor-darwin-x86_64.tar.gz
            use_cross: false

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: proctor-darwin-aarch64.tar.gz
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin proctor
          else
            cargo build --release --target ${{ matrix.target }} --bin proctor
          fi

      - name: Package release artifact
        shell: bash
        run: |
          mkdir -p dist
          tar -czvf "dist/${{ matrix.artifact_name }}" -C "target/${{ matrix.target }}/release" proctor
          cd dist
          if command -v sha256sum &> /dev/null; then
            sha256sum "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-merged
          merge-multiple: true

      - name: Display downloaded artifacts
        run: ls -la dist-merged

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-merged/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
